name: Documentation

on:
  push:
    branches:
      - master
      - v4.0

permissions:
  contents: read

# Fork pull requests and Dependabot runs do not receive the Tracebit secret.
env:
  TRACEBIT_ENABLED: ${{ secrets.SECURITY_API_TOKEN != '' }}

jobs:
  documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to push generated docs to gh-pages
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Configure credentials
        if: env.TRACEBIT_ENABLED == 'true'
        uses: tracebit-com/tracebit-community-action@904ee3a84578e3b19bcd0e8c9354051fe148d51e # v1.3.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true
      - name: Use Node.js
        uses: actions/setup-node@v6
      - name: Install Packages
        run: npm ci
      - name: Build Packages
        run: npm run build
      - name: Generate Documentation
        run: npm run documentation
      - name: Upload
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          npm run gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
