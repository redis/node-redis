name: Tests

on:
  push:
    branches:
      - master
      - v4.0
      - v5
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - master
      - v4.0
      - v5
    paths-ignore:
      - "**/*.md"

# Fork pull requests and Dependabot runs do not receive the Tracebit secret.
env:
  TRACEBIT_ENABLED: ${{ secrets.SECURITY_API_TOKEN != '' }}

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure credentials
        if: env.TRACEBIT_ENABLED == 'true'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Packages
        run: npm ci
      - name: Lint changed files
        run: npm run lint:changed

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
        redis:
          - tag: "rs-7.4.0-v1"
            version: "7.4"
          - tag: "8.2"
            version: "8.2"
          - tag: "8.8.0"
            version: "8.8"
          - tag: "8.10.0"
            version: "8.10"
          - tag: "8.12.0"
            version: "8.12"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Configure credentials
        if: env.TRACEBIT_ENABLED == 'true'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true
      - name: Run tests
        uses: ./.github/actions/run-tests
        with:
            node-version: ${{ matrix.node-version }}
            redis-tag: ${{ matrix.redis.tag }}
            redis-version: ${{ matrix.redis.version }}
            otel-authorization-token: ${{ secrets.SELF_CHECK_OTEL_AUTHORIZATION_TOKEN }}
